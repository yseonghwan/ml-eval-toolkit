name: CI Check & Unit Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies and run checks
        run: |
          if [ -f "ml-eval-toolkit.zip" ] && [ ! -f "pyproject.toml" ]; then
            unzip -o ml-eval-toolkit.zip
          fi
          TOML_PATH=$(find . -maxdepth 3 -name "pyproject.toml" | head -n 1)
          if [ -n "$TOML_PATH" ]; then
            cd "$(dirname "$TOML_PATH")"
          fi
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          ruff check src tests --select F
          pytest -v
