[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-eval-toolkit"
version = "0.1.0"
description = "Deterministic ML/DL debugging, feature-map inspection, and quantitative clustering evaluation CLI & library"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Seonghwan Yu"}
]
dependencies = [
    "numpy>=1.23.0",
    "matplotlib>=3.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.2.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
tf = [
    "tensorflow>=2.12.0",
    "keras>=2.12.0",
]

[project.scripts]
ml-eval = "ml_eval_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true
